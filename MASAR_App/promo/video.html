<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>MASAR promo</title>
<style>
@font-face{font-family:Lalezar;src:url(../www/fonts/lalezar-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Lalezar;src:url(../www/fonts/lalezar-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Baloo;font-weight:700;src:url(../www/fonts/baloo-bhaijaan-2-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Baloo;font-weight:700;src:url(../www/fonts/baloo-bhaijaan-2-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--ink:#1d0f3a;--paper:#fffaf0;--pink:#ff3d8b;--yellow:#ffd21f;--teal:#19d3b4;--sky:#5cc8ff;--orange:#ff8a3c;--violet:#5a2be0;--lilac:#c9a6ff}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--violet)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#6c3df0 0,#5a2be0 55%,#4316b8 100%);font-family:Baloo,sans-serif;color:var(--paper)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,250,240,.09) 3px,transparent 3px);background-size:44px 44px}
.blob{position:absolute;border-radius:50%;will-change:transform}
svg.roads{position:absolute;inset:0;width:1080px;height:1920px}
.r{fill:none;stroke-width:40;stroke-linecap:round}
.lane{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:24 38}
.center{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.logo{width:330px;height:330px;border-radius:76px;border:7px solid var(--ink);box-shadow:10px 12px 0 var(--ink);background:var(--paper)}
.word{font:400 210px/1.1 Lalezar;text-shadow:10px 12px 0 var(--ink);color:var(--paper)}
.pill{font:700 50px/1.2 Baloo;color:var(--ink);background:var(--yellow);border:7px solid var(--ink);border-radius:999px;box-shadow:8px 10px 0 var(--ink);padding:6px 46px}
.cap{position:absolute;top:150px;left:60px;right:60px;text-align:center}
.cap h1{font:400 118px/1.12 Lalezar;color:var(--paper);text-shadow:8px 10px 0 var(--ink)}
.cap p{display:inline-block;margin-top:26px;font:700 44px/1.3 Baloo;color:var(--ink);background:var(--paper);border:6px solid var(--ink);border-radius:30px;box-shadow:7px 9px 0 var(--ink);padding:10px 34px}
.phone{position:absolute;left:50%;top:590px;width:610px;height:1320px;margin-left:-305px;border-radius:84px;background:var(--ink);padding:18px;box-shadow:22px 26px 0 rgba(29,15,58,.55);transform-origin:50% 100%}
.screen{position:relative;width:100%;height:100%;border-radius:68px;overflow:hidden;background:#fff4d9}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.notch{position:absolute;top:18px;left:50%;width:170px;height:40px;margin-left:-85px;background:var(--ink);border-radius:0 0 26px 26px;z-index:3}
.sticker{position:absolute;display:grid;place-items:center;width:150px;height:150px;border-radius:50%;border:7px solid var(--ink);box-shadow:7px 9px 0 var(--ink);color:var(--ink)}
.sticker svg{width:82px;height:82px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tagchip{position:absolute;font:700 40px/1 Baloo;color:var(--ink);border:6px solid var(--ink);border-radius:999px;box-shadow:6px 8px 0 var(--ink);padding:18px 30px;white-space:nowrap;display:flex;gap:14px;align-items:center}
.tagchip svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.wipe{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;background:#fff4d9}
.chips{display:flex;gap:22px;margin-top:60px;flex-wrap:wrap;justify-content:center;max-width:960px}
.chips span{font:700 40px/1 Baloo;color:var(--ink);border:6px solid var(--ink);border-radius:999px;box-shadow:6px 8px 0 var(--ink);padding:18px 30px}
.small{font:700 44px/1.3 Baloo;color:var(--paper);margin-top:44px;text-shadow:4px 5px 0 var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div class="dots"></div>
  <div class="blob" id="b1" style="width:760px;height:760px;background:var(--pink);left:520px;top:-260px"></div>
  <div class="blob" id="b2" style="width:300px;height:300px;background:var(--yellow);left:110px;top:1500px"></div>
  <div class="blob" id="b3" style="width:220px;height:220px;background:var(--teal);left:820px;top:1350px"></div>

  <svg class="roads" id="roads" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <path class="r" id="r2" stroke="#19d3b4" d="M70 -20C60 140 190 170 170 290S60 430 110 820" style="stroke-width:16"/>
    <path class="r" id="r3" stroke="#ff3d8b" d="M420 620C300 620 300 500 210 450S120 240 300 -20" style="stroke-width:16"/>
    <path class="r" id="r1" stroke="#ffd21f" d="M-30 760C80 680 40 560 140 520S260 470 230 400S190 340 200 318" style="stroke-width:16"/>
    <path class="lane" id="l1" stroke="#1d0f3a" d="M-30 760C80 680 40 560 140 520S260 470 230 400S190 340 200 318" style="stroke-width:2.5;stroke-dasharray:10 16"/>
    <g id="car"><g transform="scale(1.25)"><rect x="-17" y="-11" width="34" height="22" rx="8" fill="#fffaf0" stroke="#1d0f3a" stroke-width="3"/><rect x="2" y="-7.5" width="8" height="15" rx="3" fill="#5cc8ff" stroke="#1d0f3a" stroke-width="2"/><circle cx="14" cy="-6" r="2.2" fill="#ffd21f"/><circle cx="14" cy="6" r="2.2" fill="#ffd21f"/></g></g>
  </svg>

  <div class="center" id="intro" style="top:560px">
    <img class="logo" id="logo" src="../www/logo-light.svg" alt="">
    <div class="word" id="word" style="margin-top:30px">مسار</div>
    <div class="pill" id="tag" style="margin-top:10px">طريقك أقصر، وصولك أسرع</div>
  </div>

  <div class="phone" id="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
  <div id="caps"></div>
  <div id="stickers"></div>

  <div class="center" id="outro" style="top:470px">
    <img class="logo" id="ologo" src="../www/logo-light.svg" alt="">
    <div class="word" id="oword" style="margin-top:30px">مسار</div>
    <div class="pill" id="otag" style="margin-top:10px">طريقك أقصر، وصولك أسرع</div>
    <div class="chips" id="ochips">
      <span style="background:var(--teal)">إرشاد صوتي</span><span style="background:var(--pink)">بلاغات حيّة</span>
      <span style="background:var(--sky)">Android Auto</span><span style="background:var(--orange)">بدون إنترنت</span>
    </div>
    <div class="small" id="osmall">محافظة رام الله والبيرة · صُنع في فلسطين</div>
  </div>
  <div class="wipe" id="wipe"></div>
</div>

<script>
/* Every frame is a pure function of time (seek(t)), so the video renders frame by frame without dropped frames. */
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - (1 - x) ** 3;
const inOutCubic = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
const outBack = (x) => { const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const inCubic = (x) => x ** 3;

const ICON = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',
  route: '<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
  sound: '<path d="M4 9v6h4l5 4V5L8 9zM16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>',
  music: '<circle cx="7" cy="17.5" r="3"/><circle cx="17" cy="15.5" r="3"/><path d="M10 17.5V5l10-2v12.5"/>',
  speed: '<path d="M4 17a8 8 0 1 1 16 0M12 17l4-5"/>',
  crash: '<path d="M12 2.5l2 5 5-2-2 5 5 1.5-5 2.5 2 5-5-2-2 5-2-5-5 2 2-5-5-2.5 5-1.5-2-5 5 2z"/>',
  barrier: '<rect x="2" y="8" width="20" height="5" rx="1.5"/><path d="M6.5 8l-3 5M11.5 8l-3 5M16.5 8l-3 5M21 9l-2.3 4M5 13v8M19 13v8"/>',
  jam: '<rect x="2.5" y="10" width="8.5" height="6" rx="2"/><rect x="13" y="10" width="8.5" height="6" rx="2"/><path d="M5 16v2M8.5 16v2M15.5 16v2M19 16v2M4 10l1.5-3h3L10 10M14.5 10l1.5-3h3L20.5 10"/>',
  police: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M12 8l1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 14l-2.4 1.2.5-2.6-1.9-1.8 2.6-.4z"/>',
  hazard: '<path d="M12 3L2 20h20zM12 10v4.5M12 17.2v.3"/>',
  fuel: '<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M7 7h5v4H7zM15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
  pill: '<path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7"/>',
  food: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/>',
  coffee: '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.8 4M16 6h3.5a3.5 3.5 0 0 1-3.8 4M12 13v4M9 21h6M10 17h4v4h-4z"/>',
  star: '<path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.2L12 17l-5.6 3.1 1.2-6.2L3 9.6l6.3-.8z"/>',
  home: '<path d="M3 11l9-8 9 8M5.5 9.5V21h13V9.5M10 21v-6h4v6"/>',
  parking: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>',
  share: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/>',
};
const svg = (n) => `<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;

/* Scenes after the intro: the phone shows a real app screen, the caption says what it does. */
const START = 3.6, LEN = 3.1;
const SCENES = [
  { img: 'home', title: 'وين بدك تروح؟', sub: 'قرية، شارع، أو حتى مبنى بعينه', blob: '#ff3d8b',
    st: [['search', '#ffd21f', 70, 760], ['home', '#19d3b4', 870, 1050]] },
  { img: 'search', title: 'دوّر على أي مكان', sub: 'آلاف الأماكن بمحافظة رام الله والبيرة', blob: '#19d3b4',
    st: [['star', '#ffd21f', 860, 760], ['search', '#ff3d8b', 70, 1180]] },
  { img: 'route', title: 'أفضل طريق، مش أي طريق', sub: 'بيقارن الطرق وبحسب حساب الزحمة', blob: '#ffd21f',
    st: [['route', '#19d3b4', 70, 800], ['jam', '#ff8a3c', 870, 1180]] },
  { img: 'drive', title: 'بيرشدك بالصوت', sub: 'خطوة بخطوة، وموسيقاك معك', blob: '#5cc8ff', zoom: true,
    st: [['sound', '#ffd21f', 860, 780], ['music', '#c9a6ff', 70, 1050], ['speed', '#ff3d8b', 860, 1400]] },
  { img: 'map', title: 'الطريق بعيون السواقين', sub: 'حوادث، حواجز، زحمة… لحظة بلحظة', blob: '#ff8a3c',
    st: [['crash', '#ff3d8b', 70, 760], ['barrier', '#c9a6ff', 870, 940], ['police', '#5cc8ff', 70, 1300], ['hazard', '#ffd21f', 870, 1480]] },
  { img: 'report', title: 'بلّغ بكبسة', sub: 'وساعد غيرك يوصل أسرع', blob: '#ff3d8b',
    st: [['crash', '#ff3d8b', 860, 800], ['jam', '#ff8a3c', 70, 1150]] },
  { img: 'nearby', title: 'كل إشي قريب منك', sub: 'بنزين، صيدلية، أكل، قهوة', blob: '#19d3b4',
    st: [['fuel', '#ffd21f', 70, 760], ['pill', '#ff3d8b', 870, 980], ['food', '#ff8a3c', 70, 1230], ['coffee', '#5cc8ff', 870, 1460]] },
  { img: 'account', title: 'اكسب نقاط', sub: 'من «مبتدئ» لـ«أسطورة مسار»', blob: '#ffd21f',
    st: [['trophy', '#ffd21f', 860, 780], ['star', '#ff3d8b', 70, 1120]] },
];
const END = START + SCENES.length * LEN; // the outro starts here
const DURATION = END + 5.4;

/* Build the scene layers once. */
SCENES.forEach((s, i) => {
  const img = document.createElement('img');
  img.src = `shots/light_${s.img}.png`;
  img.id = `img${i}`;
  $('screen').append(img);
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.id = `cap${i}`;
  cap.innerHTML = `<h1>${s.title}</h1><p>${s.sub}</p>`;
  $('caps').append(cap);
  s.st.forEach(([ic, color, x, y], j) => {
    const d = document.createElement('div');
    d.className = 'sticker';
    d.id = `st${i}_${j}`;
    d.style.cssText = `left:${x}px;top:${y}px;background:${color}`;
    d.innerHTML = svg(ic);
    $('stickers').append(d);
  });
});

const roads = ['r1', 'r2', 'r3'].map((id) => $(id));
roads.forEach((r) => { r.len = r.getTotalLength(); r.style.strokeDasharray = r.len; });
const lane = $('l1');

function seek(t) {
  /* background blobs drift all the time; the big one changes colour with the scene */
  const scene = Math.floor((t - START) / LEN);
  const cur = SCENES[clamp(scene, 0, SCENES.length - 1)];
  $('b1').style.transform = `translate(${Math.sin(t * 0.7) * 40}px, ${Math.cos(t * 0.5) * 30}px) scale(${1 + Math.sin(t * 0.9) * 0.04})`;
  $('b1').style.background = t < START ? '#ff3d8b' : t >= END ? '#ff3d8b' : cur.blob;
  $('b2').style.transform = `translate(${Math.cos(t * 0.8) * 30}px, ${Math.sin(t * 0.6) * 40}px)`;
  $('b3').style.transform = `translate(${Math.sin(t * 1.1) * 26}px, ${Math.cos(t * 0.9) * 26}px)`;

  /* ---------- intro: roads draw, the car drives in, the logo pops, the name writes itself */
  const introOut = inCubic(prog(t, 3.1, 3.6));
  roads.forEach((r, i) => {
    const k = inOutCubic(prog(t, 0.1 + i * 0.12, 1.3 + i * 0.12));
    r.style.strokeDashoffset = r.len * (1 - k);
  });
  $('roads').style.opacity = 1 - introOut * 0.85;
  lane.style.opacity = prog(t, 1.2, 1.6) * 0.5;
  const drive = inOutCubic(prog(t, 0.35, 1.65));
  const r1 = roads[0], p = r1.getPointAtLength(r1.len * drive), q = r1.getPointAtLength(Math.min(r1.len, r1.len * drive + 1));
  const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
  $('car').setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${ang})`);
  $('car').style.opacity = t < 0.35 ? 0 : t < 1.6 ? 1 : 1 - prog(t, 1.6, 1.8);
  const pop = prog(t, 1.55, 2.25);
  $('logo').style.transform = `scale(${pop ? outBack(pop) : 0}) rotate(${-25 + 21 * outCubic(pop)}deg) translateY(${Math.sin(t * 2.6) * 6 * prog(t, 2.3, 2.6)}px)`;
  const w = outCubic(prog(t, 1.95, 2.55));
  $('word').style.clipPath = `inset(-20% -10% -20% ${110 - 120 * w}%)`;
  $('word').style.transform = `translateY(${18 * (1 - w)}px)`;
  const tg = prog(t, 2.3, 2.85);
  $('tag').style.opacity = clamp(tg * 2);
  $('tag').style.transform = `translateY(${80 * (1 - outBack(tg))}px) rotate(${8 - 10 * outBack(tg)}deg)`;
  $('intro').style.opacity = 1 - introOut;
  $('intro').style.transform = `scale(${1 - introOut * 0.25}) translateY(${-introOut * 120}px)`;

  /* ---------- the phone: rises in after the intro, floats, leaves before the outro */
  const inK = outBack(prog(t, START - 0.3, START + 0.5)), outK = inCubic(prog(t, END - 0.2, END + 0.4));
  const float = Math.sin(t * 1.6) * 10, tilt = Math.sin(t * 1.1) * 1.4;
  let zoom = 1;
  if (scene >= 0 && scene < SCENES.length && SCENES[scene].zoom) zoom = 1 + 0.05 * inOutCubic(prog(t, START + scene * LEN, START + (scene + 1) * LEN));
  $('phone').style.transform = `translateY(${(1 - inK) * 1500 + outK * 1600 + float}px) rotate(${tilt + (1 - inK) * 10 - outK * 8}deg) scale(${zoom})`;
  $('phone').style.opacity = t < START - 0.3 ? 0 : 1;

  /* screens cross-slide; captions bounce in and lift out; stickers pop around the phone */
  SCENES.forEach((s, i) => {
    const a = START + i * LEN, b = a + LEN;
    const enter = i === 0 ? 1 : inOutCubic(prog(t, a - 0.1, a + 0.45));
    const leave = i === SCENES.length - 1 ? 0 : inOutCubic(prog(t, b - 0.1, b + 0.45));
    const img = $(`img${i}`);
    const visible = t >= a - 0.1 && t < b + 0.45 || (i === SCENES.length - 1 && t >= a);
    img.style.opacity = visible ? 1 : 0;
    img.style.transform = `translateX(${(1 - enter) * -102 + leave * 30}%) scale(${1 - leave * 0.1})`;
    img.style.filter = `brightness(${1 - leave * 0.45})`;
    img.style.zIndex = i;

    const cin = prog(t, a + 0.05, a + 0.6), cout = prog(t, b - 0.35, b - 0.05);
    const cap = $(`cap${i}`);
    cap.style.opacity = t < a || t > b ? 0 : clamp(cin * 2) * (1 - cout);
    cap.style.transform = `translateY(${(1 - outBack(cin)) * 90 - cout * 60}px) scale(${0.9 + 0.1 * outBack(cin)})`;
    cap.querySelector('p').style.transform = `rotate(${-2 + Math.sin(t * 2) * 0.6}deg) translateY(${(1 - outBack(prog(t, a + 0.25, a + 0.8))) * 60}px)`;
    cap.querySelector('p').style.opacity = clamp(prog(t, a + 0.25, a + 0.6) * 2);

    s.st.forEach((_, j) => {
      const d = $(`st${i}_${j}`);
      const k = prog(t, a + 0.35 + j * 0.12, a + 0.85 + j * 0.12), o = prog(t, b - 0.3, b);
      const live = t >= a && t <= b;
      d.style.opacity = live ? clamp(k * 3) * (1 - o) : 0;
      d.style.transform = `scale(${live ? outBack(k) * (1 - o * 0.6) : 0}) rotate(${(j % 2 ? 1 : -1) * (12 + Math.sin(t * 2.2 + j) * 6)}deg) translateY(${Math.sin(t * 2.4 + j * 1.3) * 12}px)`;
    });
  });

  /* ---------- outro: logo, name, line, feature chips */
  const o = t - END;
  $('outro').style.opacity = o < 0 ? 0 : 1;
  const opop = prog(o, 0.2, 0.9);
  $('ologo').style.transform = `scale(${o < 0.2 ? 0 : outBack(opop)}) rotate(${-25 + 21 * outCubic(opop)}deg) translateY(${Math.sin(t * 2.6) * 6}px)`;
  const ow = outCubic(prog(o, 0.6, 1.2));
  $('oword').style.clipPath = `inset(-20% -10% -20% ${110 - 120 * ow}%)`;
  const ot = prog(o, 1.0, 1.5);
  $('otag').style.opacity = clamp(ot * 2);
  $('otag').style.transform = `translateY(${80 * (1 - outBack(ot))}px) rotate(${8 - 10 * outBack(ot)}deg)`;
  [...$('ochips').children].forEach((c, i) => {
    const k = prog(o, 1.5 + i * 0.15, 2.0 + i * 0.15);
    c.style.opacity = clamp(k * 3);
    c.style.transform = `scale(${o < 1.5 ? 0 : outBack(k)}) rotate(${(i % 2 ? 2 : -2)}deg)`;
    c.style.display = 'inline-block';
  });
  $('osmall').style.opacity = prog(o, 2.4, 2.9);

  /* a cream circle wipes open at the very start and closes at the end */
  const wipeIn = 1 - outCubic(prog(t, 0, 0.45)), wipeOut = inCubic(prog(t, DURATION - 0.5, DURATION));
  $('wipe').style.transform = `scale(${Math.max(wipeIn, wipeOut)})`;
}

window.DURATION = DURATION;
window.seek = seek;
seek(0);
/* Opened in a normal browser, it plays by itself. */
if (!navigator.webdriver) {
  const t0 = performance.now();
